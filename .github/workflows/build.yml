name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0). Leave empty to only build."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - aarch64-linux-android # Termux
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)        sudo apt-get install -y gcc-multilib ;;
            aarch64-unknown-linux-gnu)     sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            armv7-unknown-linux-gnueabihf) sudo apt-get install -y gcc-arm-linux-gnueabihf ;;
            x86_64-unknown-linux-musl)     sudo apt-get install -y musl-tools ;;
          esac

      # aarch64-musl: zig ships its own musl + cross linker, nothing to download from musl.cc
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Configure target
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
              ;;
            armv7-unknown-linux-gnueabihf)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
              echo "AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar" >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-musl)
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              ;;
            aarch64-linux-android)
              # NDK is preinstalled on ubuntu runners; API 24 = Android 7, below anything Termux supports
              bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
              echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
              echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then sub=zigbuild; else sub=build; fi
          cargo $sub --release --locked --target ${{ matrix.target }}

      # tar keeps the exec bit; unique archive names stop artifacts overwriting each other on merge
      - run: tar -czf downflac-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release downflac

      - uses: actions/upload-artifact@v4
        with:
          name: downflac-${{ matrix.target }}
          path: downflac-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - run: tar -czf downflac-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release downflac

      - uses: actions/upload-artifact@v4
        with:
          name: downflac-${{ matrix.target }}
          path: downflac-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys assembles x86/x64 via NASM
      - if: matrix.target != 'aarch64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - run: Compress-Archive target/${{ matrix.target }}/release/downflac.exe downflac-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: downflac-${{ matrix.target }}
          path: downflac-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      stable: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # move the rolling tag to this commit
      - if: env.stable != 'true'
        run: git tag -f nightly && git push -f origin nightly

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'nightly' }}
          prerelease: ${{ env.stable != 'true' }}
          files: dist/**
